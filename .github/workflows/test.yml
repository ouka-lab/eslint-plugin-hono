name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  node:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: ./.github/actions/setup-node-npm
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm run ci:audit
    - name: Restore Vitest results
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules/.vite/vitest
        key: vitest-results-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vitest-results-${{ github.run_id }}-
    - name: Run tests
      run: |
        if ls node_modules/.vite/vitest/*/results.json >/dev/null 2>&1; then
          npm run test:last
        else
          npm run test
        fi

    - name: Save Vitest results
      if: always()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: node_modules/.vite/vitest
        key: vitest-results-${{ github.run_id }}-${{ github.run_attempt }}

  bun:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest
    - run: bun install --ignore-scripts
    - name: Test with Bun
      run: bun run test
