name: Setup Node.js and npm
description: Set up Node.js, install a version-pinned, checksum-verified npm, and install Socket Firewall (sfw).

inputs:
  node-version:
    description: Node.js version to set up.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install pinned npm
      shell: bash
      env:
        NPM_VERSION: 12.2.2
        NPM_SHA512: 2a09606d9c9a71fee31fe147b8d46a56e0b3422f15848d9aec9f3b231e3716c3d3b99a065a62175c6759b4150e03bf6fc0bf8825112a511573ba903b3ec41370
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/npm.tgz" "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
        echo "${NPM_SHA512}  $RUNNER_TEMP/npm.tgz" | sha512sum -c -
        npm install -g --ignore-scripts "$RUNNER_TEMP/npm.tgz"
        npm --version

    # Socket Firewall Free (https://socket.dev/features/firewall).
    # The binary is ~130 MB, so it is cached per version + checksum. Bump
    # SFW_VERSION and SFW_SHA256 together (sha256 is shown as the asset digest
    # on https://github.com/SocketDev/sfw-free/releases). Linux x86_64 only.
    - name: Resolve Socket Firewall version
      id: sfw
      shell: bash
      env:
        SFW_VERSION: v1.16.0
        SFW_SHA256: 1f24d2628aeb3995f1f2651509e37641c7c41d07749ac68594ecb5bb2dd44d8a
      run: |
        set -euo pipefail
        {
          echo "version=${SFW_VERSION}"
          echo "sha256=${SFW_SHA256}"
          echo "dir=${RUNNER_TOOL_CACHE}/sfw/${SFW_VERSION}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Socket Firewall from cache
      id: sfw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.sfw.outputs.dir }}
        key: sfw-${{ runner.os }}-${{ runner.arch }}-${{ steps.sfw.outputs.version }}-${{ steps.sfw.outputs.sha256 }}

    - name: Download Socket Firewall
      if: steps.sfw-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SFW_VERSION: ${{ steps.sfw.outputs.version }}
        SFW_SHA256: ${{ steps.sfw.outputs.sha256 }}
        SFW_DIR: ${{ steps.sfw.outputs.dir }}
      run: |
        set -euo pipefail
        mkdir -p "$SFW_DIR"
        curl -fsSL -o "$SFW_DIR/sfw" "https://github.com/SocketDev/sfw-free/releases/download/${SFW_VERSION}/sfw-free-linux-x86_64"
        echo "${SFW_SHA256}  $SFW_DIR/sfw" | sha256sum -c -
        chmod +x "$SFW_DIR/sfw"

    - name: Add Socket Firewall to PATH
      shell: bash
      env:
        SFW_SHA256: ${{ steps.sfw.outputs.sha256 }}
        SFW_DIR: ${{ steps.sfw.outputs.dir }}
      run: |
        set -euo pipefail
        # Re-verify on cache hits too, so a poisoned cache entry cannot run.
        echo "${SFW_SHA256}  $SFW_DIR/sfw" | sha256sum -c -
        echo "$SFW_DIR" >> "$GITHUB_PATH"
